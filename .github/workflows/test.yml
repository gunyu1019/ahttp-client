---
name: Test

on:
  push:
    branches: ["main", "develop", "v2.0"]
  pull_request:
    branches: ["main", "develop", "v2.0"]
  workflow_dispatch:
  workflow_call:

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: Unit tests
        run: python -m pytest -v -s tests/unit --cov=ahttp_client --cov-report term-missing:skip-covered

  integration:
    name: Integration (${{ matrix.backend.name }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        backend:
          - name: aiohttp.ClientSession
            selector: aiohttp
            extras: ".[test]"
          - name: httpx.AsyncClient
            selector: httpx_async
            extras: ".[test,httpx]"
          - name: httpx.Client
            selector: httpx_sync
            extras: ".[test,httpx]"
          - name: requests.Session
            selector: requests
            extras: ".[test,requests]"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.backend.extras }}"
      - name: Run backend integration tests
        run: python -m pytest -v -s tests/integration -k ${{ matrix.backend.selector }}
