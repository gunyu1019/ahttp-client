---
name: Type Check

on:
  push:
    branches: ["main", "develop", "v2.0"]
  pull_request:
    branches: ["main", "develop", "v2.0"]
  workflow_dispatch:
  workflow_call:

jobs:
  source:
    name: mypy (Python 3.14; targets 3.11–3.14)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[typecheck,aiohttp,httpx,requests,pydantic,marshmallow]"
      - name: Run strict type checks
        run: |
          python -m mypy --python-version 3.11
          python -m mypy --python-version 3.12
          python -m mypy --python-version 3.13
          python -m mypy --python-version 3.14

  package:
    name: Installed package typing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build ".[typecheck,aiohttp,httpx,requests,pydantic,marshmallow]"
      - name: Build wheel
        run: python -m build --wheel
      - name: Verify PEP 561 marker
        run: unzip -l dist/*.whl | grep -q "ahttp_client/py.typed"
      - name: Check installed public types
        run: |
          mkdir -p "$RUNNER_TEMP/typecheck-consumer"
          cp tests/typecheck/*.py "$RUNNER_TEMP/typecheck-consumer/"
          python -m pip install --force-reinstall --no-deps "$GITHUB_WORKSPACE"/dist/*.whl
          cd "$RUNNER_TEMP/typecheck-consumer"
          python -m mypy --config-file "$GITHUB_WORKSPACE/pyproject.toml" --strict .
