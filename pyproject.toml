[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ahttp_client"
dynamic = ["version", "dependencies"]
description = "A framework for easy asynchronous HTTP request calling with decorations"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    {name = "gunyu1019", email = "gunyu1019@yhs.kr"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Natural Language :: Korean",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.optional-dependencies]
pydantic = [
    "pydantic>=2.12",
]
marshmallow = [
    "marshmallow>=3",
]
aiohttp = [
    "aiohttp>=3.11.2",
]
httpx = [
    "httpx>=0.28.1",
]
requests = [
    "requests>=2.32.3",
]
test = [
    "pytest",
    "pytest-cov",
    "aiohttp>=3.11.2",
    "marshmallow>=3",
    "httpx>=0.28.1",
    "pydantic>=2.12",
    "requests>=2.32.3",
]
lint = [
    "pycodestyle",
    "black"
]
typecheck = [
    "mypy==2.3.0",
]
docs = [
    "Sphinx",
    "sphinxawesome-theme",
    "sphinx-intl",
    "aiohttp>=3.11.2",
    "httpx>=0.28.1",
    "requests>=2.32.3",
]

[project.urls]
Homepage = "https://github.com/gunyu1019/ahttp-client"
"Issue Tracker" = "https://github.com/gunyu1019/ahttp-client/issues"

[tool.setuptools]
packages = [
    "ahttp_client",
    "ahttp_client.backend",
    "ahttp_client.serialization",
]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "ahttp_client.__version__"}
dependencies = { file = "requirements.txt"}

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "backend_integration: tests that compare supported HTTP backends",
    "serialization_integration: aiohttp loopback tests for third-party codecs",
]

[tool.black]
line-length = 120
target-version = ["py311", "py312", "py313", "py314"]

[tool.mypy]
python_version = "3.11"
files = [
    "ahttp_client",
    "tests/typecheck",
]
plugins = [
    "ahttp_client.mypy",
]
strict = true
show_error_codes = true
pretty = true
warn_unused_configs = true
